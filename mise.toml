[settings]
lockfile = true

[vars]
prism_instances = "{{ get_env(name='XDG_DATA_HOME', default=env.HOME ~ '/.local/share') }}/PrismLauncher/instances"

[tasks.setup-mcsr]
description = "Stow Minecraft speedrun settings into a Prism instance"
usage = '''
flag "--instance <instance>" default="mcsr" help="Prism instance to stow into" {
  choices "mcsr" "rsg"
}
'''
run = """
stow -d mcsr -t "{{ vars.prism_instances }}/${usage_instance}/minecraft" -R --no-folding instance
prefs="$HOME/.java/.userPrefs/ninjabrainbot"
if [ ! -e "$prefs/prefs.xml" ]; then
  mkdir -p "$prefs"
  cp mcsr/ninjabrainbot/prefs.xml "$prefs/prefs.xml"
fi
"""

[tasks.setup]
description = "Stow config into ~/.config"
run = """
mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}"
stow -t "${XDG_CONFIG_HOME:-$HOME/.config}" -R --no-folding config
mise skills sync --dir "${CLAUDE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/claude}/skills" --prune
"""

[tasks.bootstrap]
description = "Stow config and install tools"
depends = ["setup"]
run = """
mise install
mise skills sync --dir "${CLAUDE_CONFIG_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/claude}/skills" --prune
"""

[tasks.herdr-integration]
description = "Install the herdr hook for Claude Code"
run = "herdr integration install claude"
