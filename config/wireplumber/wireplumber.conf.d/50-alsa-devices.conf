monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_01_00.1" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_input\\.usb-Focusrite.*" } ]
    actions = { update-props = { node.description = "Scarlett 4i4 Input (raw)" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\.usb-Focusrite.*" } ]
    actions = { update-props = { node.description = "Scarlett 4i4 Output" } }
  }
  {
    matches = [ { node.name = "~alsa_input\\.usb-Elgato.*" } ]
    actions = { update-props = { node.description = "Elgato HD60 X Input" } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_00_1f.3.analog-stereo" } ]
    actions = { update-props = { node.description = "Motherboard Aux Input" } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3.iec958-stereo" } ]
    actions = { update-props = { node.description = "Motherboard Aux Output" } }
  }
]
