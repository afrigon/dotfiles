"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.ssh_user}\
${custom.ssh_host}\
$directory\
$git_branch\
${custom.git_worktree}\
$git_commit\
$git_state\
$git_status\
$nix_shell\
$conda\
$docker_context\
$direnv\
$claude_model\
$claude_context\
${env_var.CLAUDE_RATE_LIMIT_FIVE_HOUR}\
${env_var.CLAUDE_RATE_LIMIT_SEVEN_DAY}\
$jobs\
$line_break\
$character\
"""

[profiles]
claude-code = """
${custom.ssh_user}\
${custom.ssh_host}\
$directory\
$git_branch\
${custom.git_worktree}\
$git_commit\
$git_state\
$git_status\
$nix_shell\
$conda\
$docker_context\
$direnv\
$claude_model\
$claude_context\
${env_var.CLAUDE_RATE_LIMIT_FIVE_HOUR}\
${env_var.CLAUDE_RATE_LIMIT_SEVEN_DAY}\
"""

[custom.ssh_user]
command = 'echo "$USER"'
when = 'test -n "$SSH_CONNECTION" -o -n "$SSH_TTY"'
shell = 'sh'
style = 'bold yellow'
format = '[$output]($style)@'

[custom.ssh_host]
command = 'uname -n'
when = 'test -n "$SSH_CONNECTION" -o -n "$SSH_TTY"'
shell = 'sh'
style = 'bold dimmed green'
format = '[$output]($style) in '

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[custom.git_worktree]
command = '''
worktree="$(basename "$(git rev-parse --show-toplevel)")"
test "$worktree" = "$(git branch --show-current)" || echo "$worktree"
'''
when = 'test "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)"'
shell = 'sh'
symbol = ' '
style = 'bold purple'
format = '[$symbol$output]($style) '

[claude_context]
format = '[$input_tokens/$total_tokens]($style) '

[[claude_context.display]]
threshold = 0.0
style = 'bold green'
hidden = true

[[claude_context.display]]
threshold = 1.0
style = 'bold green'
hidden = false

[[claude_context.display]]
threshold = 60.0
style = 'bold yellow'
hidden = false

[[claude_context.display]]
threshold = 80.0
style = 'bold red'
hidden = false

[env_var.CLAUDE_RATE_LIMIT_FIVE_HOUR]
format = '[5h ${env_value}%]($style) '
style = 'dimmed white'

[env_var.CLAUDE_RATE_LIMIT_SEVEN_DAY]
format = '[7d ${env_value}%]($style) '
style = 'dimmed white'
