let data = { type: "NONE", throws: 0, correctionIncrements: 0, predictions: [] };
let boatState = "NONE";
let warnings = [];
let gateVisible = false;

function apply() {
  document.getElementById("line").classList.toggle("hidden", !gateVisible);
}

setInterval(() => {
  fetch("state.json", { cache: "no-store" })
    .then(r => r.json())
    .then(j => { gateVisible = !!j.visible; apply(); })
    .catch(() => { gateVisible = false; apply(); });
}, 250);

function transform(raw) {
  const throws = (raw.eyeThrows || []).length;
  return {
    type: raw.resultType,
    throws: throws,
    correctionIncrements: throws > 0 ? raw.eyeThrows[throws - 1].correctionIncrements : 0,
    predictions: (raw.predictions || []).slice(0, 2).map(p => ({
      nx: p.chunkX * 2,
      nz: p.chunkZ * 2,
      certainty: p.certainty,
      distance: Math.trunc(p.overworldDistance),
      netherDistance: Math.trunc(Math.trunc(p.overworldDistance) / 8),
    })),
  };
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function render() {
  const line = document.getElementById("line");
  const p = data.predictions[0];
  const hasPred = data.type === "TRIANGULATION" && !!p;
  const hasExtras = data.throws > 0 || warnings.length > 0;
  const parts = [];

  parts.push('<img class="boat" src="' + BOATS[boatState] + '">');

  if (hasPred) {
    const cls = v => v < 0 ? "neg" : "pos";
    parts.push('<span> <span class="' + cls(p.nx) + '">' + p.nx + '.000</span>' +
               ' / 40.00000 / <span class="' + cls(p.nz) + '">' + p.nz + '.000</span></span>');
  }
  if (hasPred && hasExtras) parts.push('<span>|</span>');

  if (hasExtras) {
    const ex = [];
    if (hasPred) {
      const c = p.certainty >= 0.95 ? "chigh" : (p.certainty >= 0.9 ? "cmid" : "clow");
      ex.push('<span class="' + c + '">' + (Math.round(p.certainty * 1000) / 10).toFixed(1) + '%</span>');
      ex.push('<span>' + p.distance + ' (' + p.netherDistance + ')</span>');
    }
    if (data.correctionIncrements !== 0) {
      const a = data.correctionIncrements;
      ex.push('<span class="' + (a > 0 ? "pos" : "neg") + '">' + (a > 0 ? "+" : "") + a + '</span>');
    }
    if (data.throws > 0) ex.push('<span class="meta">t: ' + data.throws + '</span>');
    if (data.type === "FAILED" || (data.throws > 0 && data.predictions.length === 0))
      ex.push('<span class="err">reset measurements</span>');
    for (const m of warnings)
      ex.push('<span class="' + (m.severity === "ERROR" ? "err" : "warn") + '">' + esc(m.type) + '</span>');
    parts.push('<span class="extras">' + ex.join("") + '</span>');
  }

  line.innerHTML = parts.join("");
  apply();
}

function subscribe(path, handler) {
  fetch(API + path).then(r => r.json()).then(handler).catch(() => {});
  const es = new EventSource(API + path + "/events");
  es.onmessage = e => { try { handler(JSON.parse(e.data)); } catch (_) {} };
}

subscribe("/stronghold", raw => { data = transform(raw); render(); });
subscribe("/boat", raw => { boatState = raw.boatState || "NONE"; render(); });
subscribe("/information-messages", raw => {
  warnings = (raw.informationMessages || [])
    .filter(m => m.severity !== "INFO")
    .map(m => ({ severity: m.severity, type: m.type.toLowerCase().replace(/_/g, " ") }));
  render();
});
</script>
