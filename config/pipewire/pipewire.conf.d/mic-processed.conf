# Loopback instead of a null-audio-sink virtual source: quickshell only
# recognizes the exact media.class "Audio/Source", which a null sink with
# input ports cannot have. Carla links into scarlet-input-capture.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Scarlett 4i4 Input"
      capture.props = {
        node.name        = "scarlet-input-capture"
        audio.position   = [ MONO ]
        # Without this it auto-connects to the default source, which is
        # scarlet-input itself: a feedback loop.
        node.autoconnect = false
      }
      playback.props = {
        node.name        = "scarlet-input"
        node.description = "Scarlett 4i4 Input"
        media.class      = Audio/Source
        audio.position   = [ MONO ]
        priority.session = 3000
      }
    }
  }
]
